# CosmoMap-sigma as in the paper: the same network trained with the composite likelihood
# loss, which also learns a per-voxel variance for each field.
# Train with:  cosmomap-train --config configs/sigma.yaml
data:
  data_root: data/camels
  max_sims: 100
  redshifts: [0.0]
  fields_in: [Mcdm, Vcdm]
  fields_out: [T, ne]
  cosmo_params: [Omega_m, sigma_8, A_SN1, A_AGN1, A_SN2, A_AGN2]
  resolution: 128
  box_size_mpc_h: 25.0
  patch_size: 64
  include_redshift_in_cond: true
  log_floors: {Mcdm: 1.0e+6, Vcdm: 1.0, T: 10.0, ne: 1.0e-12}
  train_val_test_split: [0.8, 0.1, 0.1]

model:
  base_filters: 64
  depth: 3
  convs_per_block: 1
  bottleneck_convs: 2
  groups: 8
  cond_hidden: 192
  dropout: 0.1
  heteroscedastic: true

loss:                     # 0.408 NLL + 0.150 MSE + 0.134 MAE + 0.207 Huber + 0.01 <s^2>
  w_nll: 0.408
  w_mse: 0.150
  w_mae: 0.134
  w_huber: 0.207
  huber_delta: 1.0
  lambda_variance: 0.01

train:
  epochs: 30
  steps_per_epoch: 1000
  batch_size: 4
  learning_rate: 2.0e-4
  lr_schedule: cosine
  warmup_epochs: 1
  weight_decay: 1.0e-5
  grad_clip_norm: 1.0
  early_stop_patience: 1000
  seed: 0
  mixed_precision: true
  multi_gpu: false
  output_dir: outputs/cosmomap_sigma
