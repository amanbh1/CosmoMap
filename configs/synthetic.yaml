# Tiny configuration for the out-of-the-box demo / CI (no real data needed).
# Train with:  cosmomap-train --config configs/synthetic.yaml --synthetic
# It uses the composite likelihood loss so that the uncertainty outputs are exercised too.
data:
  data_root: data/synthetic
  redshifts: [0.0, 1.0]
  fields_in: [Mcdm, Vcdm]
  fields_out: [T, ne]
  cosmo_params: [Omega_m, sigma_8, A_SN1, A_AGN1, A_SN2, A_AGN2]
  resolution: 32
  box_size_mpc_h: 25.0
  patch_size: 16
  include_redshift_in_cond: true

model:
  base_filters: 16
  depth: 2
  groups: 4
  cond_hidden: 32
  dropout: 0.1
  heteroscedastic: true

loss:
  w_nll: 0.408
  w_mse: 0.150
  w_mae: 0.134
  w_huber: 0.207
  lambda_variance: 0.01

train:
  epochs: 2
  steps_per_epoch: null   # one pass over the training samples per epoch
  batch_size: 2
  learning_rate: 1.0e-3
  warmup_epochs: 0
  mixed_precision: false
  output_dir: outputs/synthetic
