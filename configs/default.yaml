# CosmoMap as in the paper: mean-squared-error loss, 64^3 patches, conditioning on the
# six CAMELS parameters and the redshift. Needs CAMELS data (see the README).
# Train with:  cosmomap-train --config configs/default.yaml
#
# The loader keeps the data in memory; max_sims limits how many simulations are read.
# The runs of the paper used all 1000 simulations through the memory-mapped scripts in
# paper_experiments/.
data:
  data_root: data/camels
  max_sims: 100
  redshifts: [0.0]
  fields_in: [Mcdm, Vcdm]
  fields_out: [T, ne]
  cosmo_params: [Omega_m, sigma_8, A_SN1, A_AGN1, A_SN2, A_AGN2]
  resolution: 128
  box_size_mpc_h: 25.0
  patch_size: 64
  include_redshift_in_cond: true
  log_floors: {Mcdm: 1.0e+6, Vcdm: 1.0, T: 10.0, ne: 1.0e-12}
  train_val_test_split: [0.8, 0.1, 0.1]

model:
  base_filters: 64        # 64 -> 128 -> 256 channels; bottleneck held at 256
  depth: 3
  convs_per_block: 1
  bottleneck_convs: 2     # 11,056,772 parameters in total
  groups: 8
  cond_hidden: 192
  dropout: 0.1
  heteroscedastic: true   # head kept for both variants; untrained under the MSE loss

loss:                     # mean squared error of the predicted means
  w_mse: 1.0
  w_nll: 0.0
  w_mae: 0.0
  w_huber: 0.0
  lambda_variance: 0.0

train:
  epochs: 30
  steps_per_epoch: 1000
  batch_size: 4
  learning_rate: 2.0e-4
  lr_schedule: cosine
  warmup_epochs: 1
  weight_decay: 1.0e-5
  grad_clip_norm: 1.0
  early_stop_patience: 1000
  seed: 0
  mixed_precision: true
  multi_gpu: false
  output_dir: outputs/cosmomap
